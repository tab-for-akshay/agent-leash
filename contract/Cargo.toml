[package]
name = "agent_leash"
version = "0.1.0"
edition = "2021"
description = "Agent Leash: an on-chain spending policy for an AI errand agent on NEAR"
license = "MIT"
repository = "https://github.com/tab-for-akshay/agent-leash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
